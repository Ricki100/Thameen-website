<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Shop perfumes | Thameen Ware</title>
  <meta name="description" content="Shop Arabian and designer-inspired perfumes for him and for her at Thameen Ware, Harare.">
  <meta name="theme-color" content="#172d18">
  <link rel="icon" href="assets/favicon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600&family=Montserrat:wght@300;400;500;600&display=swap">
  <link rel="stylesheet" href="css/tokens.css">
  <link rel="stylesheet" href="css/main.css">
</head>
<body>
  <div id="site-header"></div>

  <main data-page="shop">
    <section class="page-banner">
      <div class="container">
        <nav class="breadcrumb" aria-label="Breadcrumb"><a href="index.html">Home</a><span>/</span><span data-crumb>All perfumes</span></nav>
        <h1 data-title>All perfumes</h1>
      </div>
    </section>

    <section class="container section" style="padding-top:0">
      <div class="toolbar">
        <div class="chips" data-chips role="navigation" aria-label="Filter products"></div>
        <div class="toolbar__row">
          <span data-count></span>
          <label class="sr-only" for="sortSelect">Sort by</label>
          <select class="select" id="sortSelect">
            <option value="featured">Featured</option>
            <option value="price-asc">Price, low to high</option>
            <option value="price-desc">Price, high to low</option>
            <option value="name">Name, A to Z</option>
          </select>
        </div>
      </div>
      <div class="grid" data-grid></div>
    </section>
  </main>

  <div id="site-footer"></div>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/ScrollTrigger.min.js"></script>
  <script src="js/config.js"></script>
  <script src="js/products.js"></script>
  <script src="js/components.js"></script>
  <script src="js/animations.js"></script>
  <script src="js/shop.js"></script>
</body>
</html>
